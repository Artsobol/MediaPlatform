spring:
  application:
    name: media-service

  datasource:
    url: ${MEDIA_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_service}
    username: ${MEDIA_SERVICE_DATASOURCE_USER:media_service_user}
    password: ${MEDIA_SERVICE_DATASOURCE_PASSWORD:media_service_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

app:
  i18n:
    basename: classpath:i18n/messages/messages,classpath:i18n/errors/errors,classpath:i18n/validations/validations
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-seconds: 0
  retryable-task:
    limit: 100
    retry-delay: 30s
  scheduler-config:
    delay: 1000
  upload:
    max-file-size: 10MB
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    allowed-extensions:
      - .jpg
      - .jpeg
      - .png
      - .webp
  minio:
    endpoint: ${APP_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${APP_MINIO_PUBLIC_ENDPOINT:${APP_MINIO_ENDPOINT:http://localhost:9000}}
    region: ${APP_MINIO_REGION:us-east-1}
    access-key: ${APP_MINIO_ACCESS_KEY:admin}
    secret-key: ${APP_MINIO_SECRET_KEY:adminadmin}
    bucket: photos
