services:
  media-service:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    container_name: media-service
    env_file:
      - .env
    environment:
      MEDIA_SERVICE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MEDIA_SERVICE_DB:-media_service}
      MEDIA_SERVICE_DATASOURCE_USER: ${MEDIA_SERVICE_USER:-media_service_user}
      MEDIA_SERVICE_DATASOURCE_PASSWORD: ${MEDIA_SERVICE_PASSWORD:-media_service_password}
      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      APP_MINIO_REGION: us-east-1
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-adminadmin}
      APP_MINIO_BUCKET: ${MINIO_BUCKET:-photos}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-media_platform}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      MEDIA_SERVICE_DB: ${MEDIA_SERVICE_DB:-media_service}
      MEDIA_SERVICE_USER: ${MEDIA_SERVICE_USER:-media_service_user}
      MEDIA_SERVICE_PASSWORD: ${MEDIA_SERVICE_PASSWORD:-media_service_password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adminadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  postgres_data:
  minio_data:
